services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vertex-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
    networks:
      - vertex-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vertex-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - vertex-net

networks:
  vertex-net:
    driver: bridge
