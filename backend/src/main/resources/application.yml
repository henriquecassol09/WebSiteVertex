spring:
  application:
    name: backend
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]


  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN:2}
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate   # NUNCA use 'update'/'create' em produção — schema é controlado via Flyway
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        globally_quoted_identifiers: true
        format_sql: false
        jdbc.batch_size: 20
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100         # Defesa contra Pageable DoS (impede requisições de puxarem banco inteiro)

  servlet:
    multipart:
      max-file-size: 5MB           # Limite de 5MB por imagem de perfil
      max-request-size: 10MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        transport:
          protocol: smtp
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  port: ${SERVER_PORT:8080}
  max-http-request-header-size: 16KB # Bloqueia Header-Bomb DoS
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  forward-headers-strategy: framework
  tomcat:
    connection-timeout: 10000        # 10s timeout contra Slowloris
    keep-alive-timeout: 15000        # 15s keep-alive
    max-keep-alive-requests: 100     # previne sequestro indefinido de conexao keep-alive
    max-swallow-size: 10MB           # limita descarte de bytes em excesso
    threads:
      max: 200                       # pool maximo de threads operacionais
      min-spare: 20                  # threads ociosas prontas para requisicoes
    max-connections: 8192            # conexoes concorrentes maximas no socket
    accept-count: 100                # fila de conexoes aguardando processamento

app:
  security:
    jwt:
      secret: ${JWT_SECRET:vertex_jwt_secret_desenvolvimento_local_32_chars_minimo}                 # OBRIGATÓRIO em produção — mínimo 256 bits, via variável de ambiente/secret manager
      access-token-minutes: ${JWT_ACCESS_MINUTES:15}
      refresh-token-days: ${JWT_REFRESH_DAYS:7}
      issuer: backend-api
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
    rate-limit:
      auth-capacity: ${RATE_LIMIT_AUTH_CAPACITY:50}              # tentativas max por janela
      auth-refill-minutes: 1
      api-capacity: ${RATE_LIMIT_API_CAPACITY:600}              # requisicoes gerais por minuto
      api-refill-minutes: 1
      prospeccao-capacity: ${RATE_LIMIT_PROSPECCAO_CAPACITY:60}         # max 3 buscas na regiao a cada 5 minutos por IP
      prospeccao-refill-minutes: ${RATE_LIMIT_PROSPECCAO_REFILL_MINUTES:1}
      max-concurrent-requests: ${RATE_LIMIT_MAX_CONCURRENT:100}    # max requisicoes ativas simultaneas por IP
      jail-minutes: ${RATE_LIMIT_JAIL_MINUTES:1}                # tempo de quarentena temporaria para atacantes repetitivos
  tavily:
    api-key: ${TAVILY_API_KEY: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}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    org.springframework.security: WARN
    com.empresa.backend: INFO
