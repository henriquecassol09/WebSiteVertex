spring:
  application:
    name: backend
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]


  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN:2}
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate   # NUNCA use 'update'/'create' em produção — schema é controlado via Flyway
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        globally_quoted_identifiers: true
        format_sql: false
        jdbc.batch_size: 20
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  forward-headers-strategy: framework
  # Ativar TLS em produção (application-prod.yml) — nunca servir HTTP puro com dados sensíveis

app:
  security:
    jwt:
      secret: ${JWT_SECRET:vertex_jwt_secret_desenvolvimento_local_32_chars_minimo}                 # OBRIGATÓRIO em produção — mínimo 256 bits, via variável de ambiente/secret manager
      access-token-minutes: ${JWT_ACCESS_MINUTES:15}
      refresh-token-days: ${JWT_REFRESH_DAYS:7}
      issuer: backend-api
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
    rate-limit:
      auth-capacity: 10        # tentativas
      auth-refill-minutes: 1
      api-capacity: 100
      api-refill-minutes: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    org.springframework.security: WARN
    com.empresa.backend: INFO
